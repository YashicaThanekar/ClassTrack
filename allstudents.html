    </div>
    <script src="Admin/admin.js"></script>
    <main>
      <h2>All Students</h2>
      <table id="students-table" border="1" cellpadding="8">
        <thead>
          <tr>
            <th>Moodle ID</th>
            <th>Name</th>
          </tr>
        </thead>
        <tbody>
          <!-- Students will be inserted here -->
        </tbody>
      </table>
    </main>
    <script>
    fetch('http://localhost:5000/students')
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#students-table tbody');
        tbody.innerHTML = '';
        data.forEach(stu => {
          tbody.innerHTML += `<tr>
            <td>${stu.moodle_id}</td>
            <td>${stu.name}</td>
          </tr>`;
        });
      })
      .catch(err => {
        document.querySelector('#students-table tbody').innerHTML = '<tr><td colspan="2">Failed to load students</td></tr>';
      });
    </script>
</body>
</html>
