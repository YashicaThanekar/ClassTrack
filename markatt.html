<html lang="en">
<head>

</head>
<body>

</button>
        <h1>ClassTrack</h1>

    <div id="sidebar" class="sidebar">
      <a href="allstudents.html">All Students</a>
      <a href="markatt.html">Mark Attendance</a>
      <a href="analysis.html">Analysis</a>
    </div>
    <script src="Admin/admin.js"></script>
    <main>
      <h2>Mark Attendance</h2>
      <form id="attendance-form">
        <table id="attendance-table" border="1" cellpadding="8">
          <thead>
            <tr>
              <th>Moodle ID</th>
              <th>Name</th>
              <th>Present</th>
            </tr>
          </thead>
          <tbody>
            <!-- Students will be inserted here -->
          </tbody>
        </table>
        <div style="margin-top:20px; text-align:center;">
          <button type="submit" style="padding:10px 30px; font-size:1.1rem; background:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer;">Done</button>
        </div>
      </form>
    </main>
    <script>
    fetch('http://localhost:5000/students')
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector('#attendance-table tbody');
        tbody.innerHTML = '';
        data.forEach((stu, idx) => {
          tbody.innerHTML += `<tr>
            <td>${stu.moodle_id}</td>
            <td>${stu.name}</td>
            <td><input type="checkbox" name="attendance" value="present" data-moodleid="${stu.moodle_id}"></td>
          </tr>`;
        });
      });

    document.getElementById('attendance-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const rows = document.querySelectorAll('#attendance-table tbody tr');
      const attendance = [];
      rows.forEach(row => {
        const moodle_id = row.children[0].textContent;
        const name = row.children[1].textContent;
        const present = row.querySelector('input[type="checkbox"]').checked;
        attendance.push({ moodle_id, name, status: present ? 'present' : 'absent' });
      });
      // Send attendance to backend
      fetch('http://localhost:5000/mark_attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ attendance })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message || 'Attendance marked!');
      })
      .catch(() => {
        alert('Failed to save attendance.');
      });
    });
    </script>
</body>
</html>
